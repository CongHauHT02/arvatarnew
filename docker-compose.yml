version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: avatar_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: avatar_2x
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/avatar_2x.sql:/docker-entrypoint-initdb.d/init.sql:ro

  server:
    build: .
    container_name: avatar_server
    restart: always
    depends_on:
      - db
    ports:
      - "19128:19128" # Raw TCP socket
      - "19129:19129" # WebSocket Proxy for Web Browser
    environment:
      TCP_HOST: "127.0.0.1"
      TCP_PORT: "19128"
      WS_PORT: "19129"

volumes:
  db_data:
